# Αυτοματισμός RabbitMQ προς MinIO.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-red
  namespace: library-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-red
  template:
    metadata:
      labels:
        app: node-red
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.37.0
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do sleep 2; done"]
        - name: wait-for-minio
          image: busybox:1.37.0
          command: ["sh", "-c", "until nc -z minio 9000; do sleep 2; done"]
      containers:
        - name: node-red
          image: lib-system-node-red:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: library-config
            - secretRef:
                name: library-secrets
          ports:
            - name: http
              containerPort: 1880
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: node-red
  namespace: library-cloud
spec:
  type: LoadBalancer
  selector:
    app: node-red
  ports:
    - name: http
      port: 1880
      targetPort: http
