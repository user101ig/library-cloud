<!-- Λίστα και φόρμα μελών. -->
<div class="section-heading"><div><h1>Members</h1><p>Registered library members</p></div></div>
{% if message %}<p class="message">{{ message }}</p>{% endif %}
<form class="form" hx-post="/ui/members" hx-target="#content">
  <label>Full name<input name="full_name" required maxlength="200"></label>
  <label>Email<input name="email" type="email" required></label>
  <button class="primary" type="submit">Add member</button>
</form>
<div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Created</th></tr></thead><tbody>
{% for member in members %}<tr><td>{{ member.full_name }}</td><td>{{ member.email }}</td><td>{{ member.created_at.strftime("%Y-%m-%d") }}</td></tr>
{% else %}<tr><td colspan="3" class="empty">No members yet.</td></tr>{% endfor %}
</tbody></table></div>
